];


/* =====================================================
   AFFICHAGE DE LA GALERIE
   ===================================================== */

const gallery = document.getElementById("gallery");

works.forEach(work => {

    const article = document.createElement("article");

    article.className = "artwork";


    const image = document.createElement("img");

    /*
       encodeURIComponent permet notamment de gérer
       correctement les espaces dans les noms de fichiers.
    */

    image.src = "images/" + encodeURIComponent(work.file);

    image.alt = work.title || "Œuvre de Vince";

    image.loading = "lazy";


    image.onerror = function() {

        this.style.display = "none";

        const error = document.createElement("div");

        error.className = "loading";

        error.textContent = "Image introuvable : " + work.file;

        article.insertBefore(error, article.firstChild);

    };


    const info = document.createElement("div");

    info.className = "artwork-info";


    const title = document.createElement("div");

    title.className = "artwork-title";

    title.textContent = work.title || "Sans titre";


    const details = document.createElement("div");

    details.className = "artwork-details";

    details.textContent = [

        work.year,
        work.technique,
        work.size

    ]

    .filter(Boolean)

    .join(" · ");


    info.appendChild(title);

    info.appendChild(details);

    article.appendChild(image);

    article.appendChild(info);

    gallery.appendChild(article);

});

</script>
